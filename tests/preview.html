<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bili-Peek · 本地验收</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#161718;color:#eee;font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}
  nav{padding:14px 24px;border-bottom:1px solid #35363a;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  nav strong{color:#55c5ec;font-size:18px}nav span{color:#afb1b7}button{padding:8px 12px;background:#25272b;border:1px solid #44474c;border-radius:5px;color:inherit;cursor:pointer}
  main{max-width:1440px;padding:28px;margin:auto}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}
  h1{font-size:20px;margin:0 0 18px}#bilibili-player{position:relative;background:#080909;width:100%;aspect-ratio:16/9}
  video{display:block;width:100%;height:100%}.media-label{position:absolute;left:28px;top:24px;pointer-events:none;color:#c5c8ce;font-size:18px}
  .up-panel-container{padding:0 0 8px;margin-bottom:0}.up-panel-container strong{font-size:16px}.up-panel-container p{margin:4px 0;color:#aaa}
  .recommend-list-v1 h2{font-size:14px;margin:0 0 12px}.video-page-card-small{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #34363a}
  .thumb{width:112px;flex:none;aspect-ratio:16/9;background:#303b40;border-radius:5px;display:grid;place-items:center;color:#bbcbd3}
  .video-page-card-small p{margin:0}.video-page-card-small small{color:#9fa3aa}#test-results{white-space:pre-wrap;color:#b9e6bf;margin:18px 0;font:13px/1.8 Consolas,'Microsoft YaHei',monospace}
  .notice{color:#aeb2b8;margin:14px 0}.bpx-state-web{outline:2px solid #55c5ec}
  @media(max-width:900px){main{padding:18px}.layout{grid-template-columns:minmax(0,1fr)}.right-container{max-width:500px}.media-label{font-size:14px;left:14px;top:12px}}
  body.light{background:#fafafa;color:#222}body.light nav,body.light .up-panel-container{border-color:#ddd}body.light .right-container{background:#fafafa}body.light button{background:#fff;color:#222}body.light #test-results{color:#286239}
</style>
<nav><strong>Bili-Peek</strong><span>本地验收页 · 模拟弹幕与媒体 · 非 B 站实测</span><button id="run-tests" disabled>运行页面验收</button><button id="theme">切换明暗</button></nav>
<main>
  <h1>词云与密度双图 · 图内点击跳转</h1>
  <div class="layout">
    <div class="left-container">
      <div id="bilibili-player" class="bpx-player-container"><video id="sample" controls muted preload="auto" src="/silent.wav"></video><div class="media-label">160 秒静音测试媒体</div></div><span class="bpx-player-ctrl-quality-result" hidden>720P</span>
      <p class="notice">实际播放进度由浏览器媒体元素提供。右侧推荐节点应完整保留。</p>
      <pre id="test-results" aria-live="polite">等待运行验收。</pre>
    </div>
    <aside class="right-container"><div class="right-container-inner">
      <div class="up-panel-container"><strong>UP 主信息保留在面板上方</strong><p>这是模拟页面，用于验证布局与交互。</p></div>
      <div class="recommend-list-v1"><h2>接下来播放 · 推荐视频</h2>
        <div class="video-page-card-small"><div class="thumb">推荐 01</div><div><p>推荐视频节点保持原样</p><small>面板默认插入在推荐列表之前</small></div></div>
        <div class="video-page-card-small"><div class="thumb">推荐 02</div><div><p>两张图同时显示</p><small>词云在上，密度图在下</small></div></div>
        <div class="video-page-card-small"><div class="thumb">推荐 03</div><div><p>支持分 P 切换与播放器重建</p><small>不创建重复面板</small></div></div>
      </div>
    </div></aside>
  </div>
</main>
<script>window.GM_getValue=(key,fallback)=>{try{return JSON.parse(localStorage.getItem('bili-peek-'+key))??fallback}catch{return fallback}};window.GM_setValue=(key,value)=>localStorage.setItem('bili-peek-'+key,JSON.stringify(value));</script>
<script>
// Only this fixture redirects network requests; the installed userscript requests Bilibili.
window.fixtureMenus = {};
window.GM_registerMenuCommand = (name, callback) => { window.fixtureMenus[name] = callback; };
window.GM_setClipboard = text => { window.fixtureDiagnostic = JSON.parse(text); };
window.GM_xmlhttpRequest=options=>{
  if (options.url.startsWith('http://127.0.0.1:18766') && window.fixtureExport) {
    const endpoint = new URL(options.url).pathname;
    if (window.fixtureHelperOffline) { setTimeout(() => options.onerror(), 60); return { abort() {} }; }
    let result = {};
    if (endpoint === '/health') result = { ready: true };
    if (endpoint === '/sign-wbi') { window.fixtureQuality = JSON.parse(options.data).params.qn; result = { query: 'bvid=BVLocalPreview&cid=1001&qn=' + window.fixtureQuality }; }
    if (endpoint === '/clips') { window.fixtureLatestClip = JSON.parse(options.data); window.fixtureJobPolls = 0; result = { key: 'a'.repeat(20) }; }
    if (endpoint.startsWith('/jobs/')) result = window.fixtureExport === 'fail' ? { state: 'failed', error: '模拟写入失败' } : ++window.fixtureJobPolls === 1 ? { state: 'processing', stage: 'media', percent: 42, elapsedSeconds: 8 } : { state: 'complete', filename: '测试片段.md', hasSubtitles: !window.fixtureLatestClip.videoOnly, obsidianUri: 'obsidian://open?path=test.md' };
    setTimeout(() => options.onload({ status: 200, responseText: JSON.stringify(result) }), 60);
    return { abort() {} };
  }
  if (window.fixtureExport && /\/x\/player\/wbi\/v2\?/.test(options.url)) {
    setTimeout(() => options.onload({ status: 200, responseText: JSON.stringify({ code: 0, data: { subtitle: { subtitles: window.fixtureNoSubtitles ? [] : [{ lan: 'zh-Hans', lan_doc: '中文', subtitle_url: 'https://aisubtitle.hdslb.com/test.json' }] } } }) }), 30); return { abort() {} };
  }
  if (window.fixtureExport && options.url.startsWith('https://aisubtitle.hdslb.com/')) {
    setTimeout(() => options.onload({ status: 200, responseText: JSON.stringify({ body: [{ from: 0, to: 160, content: '测试字幕整句' }] }) }), 30); return { abort() {} };
  }
  if (window.fixtureExport && options.url === 'https://api.bilibili.com/x/web-interface/nav') {
    setTimeout(() => options.onload({ status: 200, responseText: JSON.stringify({ data: { wbi_img: { img_url: 'https://i.example/' + 'a'.repeat(32) + '.png', sub_url: 'https://i.example/' + 'b'.repeat(32) + '.png' } } }) }), 30); return { abort() {} };
  }
  if (window.fixtureExport && /\/x\/player\/wbi\/playurl\?/.test(options.url)) {
    setTimeout(() => options.onload({ status: 200, responseText: JSON.stringify({ code: 0, data: { dash: { video: [{ id: window.fixtureQuality, codecs: 'avc1', height: 720, baseUrl: 'https://test.bilivideo.com/video.m4s' }], audio: [{ bandwidth: 100, baseUrl: 'https://test.bilivideo.com/audio.m4s' }] } } }) }), 30); return { abort() {} };
  }
  const controller=new AbortController();
  if(window.fixtureEmptyNext && options.responseType==='arraybuffer') {window.fixtureEmptyNext=false; setTimeout(()=>options.onload({status:200,response:new ArrayBuffer(0)}),30); return {abort:()=>controller.abort()};}
  if(window.fixtureFailNext && options.responseType==='arraybuffer') {window.fixtureFailNext=false; setTimeout(()=>options.onerror(),30); return {abort:()=>controller.abort()};}
  const url=new URL(options.url); const timer=setTimeout(()=>controller.abort(),options.timeout);
  fetch('/mock'+url.pathname+url.search,{signal:controller.signal}).then(async response=>{
    const result={status:response.status,responseText:'',response:null};
    if(options.responseType==='arraybuffer') result.response=await response.arrayBuffer();
    else result.responseText=await response.text();
    clearTimeout(timer); setTimeout(()=>{if(!controller.signal.aborted) options.onload(result)},window.fixtureDelay||0);
  }).catch(error=>{clearTimeout(timer); (error.name==='AbortError'?options.onabort:options.onerror)?.(error)});
  return {abort:()=>controller.abort()};
};
</script>
<script>
// Reproduce the inherited hit-testing state captured on the user's real page.
if (new URL(location.href).searchParams.has('blocked-rail')) {
  document.querySelector('.right-container').style.pointerEvents = 'none';
}
// A delayed native initialization fixture, shaped like Bilibili's SSR root.
// It deliberately rejects foreign nodes during initialization; this is a
// lifecycle regression check, not a replay of Bilibili's private client code.
if (new URL(location.href).searchParams.has('initializing')) {
  const app = document.querySelector('main');
  app.id = 'app'; app.setAttribute('data-server-rendered', 'true');
  window.fixtureNativeNodes = [...app.querySelectorAll('*')];
  setTimeout(() => {
    const untouched = !app.querySelector('#bili-peek-panel')
      && !app.querySelector('.right-container-inner').style.marginTop;
    document.body.dataset.nativeInit = untouched ? 'passed' : 'failed';
    if (untouched) {
      const image = document.createElement('img');
      image.alt = '原页面头像'; image.width = 32; image.height = 32;
      image.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="16" fill="#55c5ec"/></svg>');
      document.querySelector('.up-panel-container').prepend(image);
      for (const thumb of document.querySelectorAll('.thumb')) thumb.prepend(image.cloneNode());
      const comment = document.createElement('section'); comment.id = 'comment'; comment.textContent = '原页面评论区已初始化';
      document.querySelector('.left-container').append(comment);
    }
    app.removeAttribute('data-server-rendered');
  }, 800);
}
</script>
<script src="/Bili-Peek.user.js"></script>
<script src="/preview.js"></script>
</html>
